name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di tab Actions GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: smart_canteen
        run: flutter pub get

      - name: Build Release APK
        working-directory: smart_canteen
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-canteen-release-apk
          path: smart_canteen/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
